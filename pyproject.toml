[project]
name = "llm-cross-pollination"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.0.0",
]

[project.scripts]
xpol = "xpol.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xpol"]
